name: publish

# Publishes to PyPI when a version tag is pushed.
#
# There is no API token anywhere in this repository or in its secrets. PyPI
# verifies the workflow itself through OIDC ("trusted publishing"), which is
# configured once on the PyPI side against this repo, this workflow filename
# and this environment name. Change any of those three and the publish stops
# being trusted — so keep them in sync with the PyPI publisher entry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # Catches a malformed README or broken metadata before anything is
      # uploaded — a version number on PyPI can never be reused.
      - run: twine check dist/*
      - name: Fail if the tag does not match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match pyproject version $version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
