[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polylab-client"
version = "0.1.0"
description = "Python client for the PolyLab API: Polymarket market data, APR, spreads, and smart money wallet activity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PolyLab" }]
keywords = [
    "polymarket",
    "prediction-markets",
    "polymarket-api",
    "trading",
    "smart-money",
    "market-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://www.polylab.app"
Documentation = "https://www.polylab.app/docs/reference/public-api-contract"
Source = "https://github.com/polylab/polylab-client"

[tool.hatch.build.targets.wheel]
packages = ["src/polylab"]
