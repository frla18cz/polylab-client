<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#111;display:grid;place-items:center;height:100%}
</style></head><body>
<canvas id="c" width="1280" height="640"></canvas>
<script>
const C = { bg:'#0f1320', panel:'#161a2b', line:'#2d3348',
            text:'#f1f5f9', sec:'#cbd5e1', muted:'#8b96ab',
            accent:'#2e75ff', green:'#4ade80' };
const ctx = document.getElementById('c').getContext('2d');
const W=1280,H=640, PAD=84;
const F='system-ui,-apple-system,"Segoe UI",sans-serif';
const M='ui-monospace,SFMono-Regular,Menlo,monospace';

ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);

// faint grid, echoing a data tool
ctx.strokeStyle='rgba(255,255,255,0.028)'; ctx.lineWidth=1;
for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H);ctx.stroke();}
for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke();}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

const img = new Image();
img.onload = function(){
  ctx.drawImage(img, PAD, 56, 76, 76);

  ctx.fillStyle=C.text; ctx.font='700 62px '+M;
  ctx.fillText('polylab-client', PAD, 210);

  ctx.fillStyle=C.sec; ctx.font='400 27px '+F;
  ctx.fillText('Polymarket data in Python. One import, zero dependencies.', PAD, 254);

  // terminal panel
  const px=PAD, py=296, pw=W-PAD*2, ph=214;
  ctx.fillStyle=C.panel; rr(px,py,pw,ph,14); ctx.fill();
  ctx.strokeStyle=C.line; ctx.lineWidth=1.5; rr(px+.5,py+.5,pw-1,ph-1,14); ctx.stroke();
  // window dots
  const dots=['#ef4444','#f59e0b','#22c55e'];
  dots.forEach((d,i)=>{ctx.fillStyle=d;ctx.beginPath();ctx.arc(px+26+i*20,py+24,5.5,0,7);ctx.fill();});

  let y = py+72; const x = px+28; const lh=34;
  ctx.font='500 22px '+M;
  ctx.fillStyle=C.accent; ctx.fillText('$', x, y);
  ctx.fillStyle=C.text;   ctx.fillText('pip install polylab-client', x+26, y);
  y += lh+10;
  ctx.fillStyle=C.muted; ctx.fillText('>>>', x, y);
  ctx.fillStyle=C.text;  ctx.fillText('client.markets(min_apr=0.5, max_spread=0.02)', x+52, y);
  y += lh;
  ctx.fillStyle=C.green; ctx.font='500 21px '+M;
  ctx.fillText('0.17 Yes  $59.2M  Will the U.S. invade Iran before 2027?', x+52, y);
  y += lh-6;
  ctx.fillStyle=C.muted; ctx.font='400 20px '+M;
  // Prefixed as a comment: indented like this it would otherwise read as
  // program output, and it is copy, not something the call actually printed.
  ctx.fillText('# 352,000 live outcomes · APR, spreads, smart money · no API key', x+52, y);

  // footer
  ctx.fillStyle=C.line; ctx.fillRect(PAD,556,W-PAD*2,1);
  ctx.fillStyle=C.sec; ctx.font='500 21px '+M;
  ctx.fillText('github.com/frla18cz/polylab-client', PAD, 598);
  ctx.fillStyle=C.muted; ctx.font='400 21px '+F;
  const t='Python 3.10+ · MIT';
  ctx.fillText(t, W-PAD-ctx.measureText(t).width, 598);

  const f=document.createElement('canvas'); f.width=W; f.height=H;
  const fx=f.getContext('2d'); fx.fillStyle=C.bg; fx.fillRect(0,0,W,H);
  fx.drawImage(document.getElementById('c'),0,0);
  window.__jpeg = f.toDataURL('image/jpeg',0.94);
  document.title='card-ready';
};
